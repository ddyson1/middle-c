<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Middle C</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&family=Press+Start+2P&family=VT323&family=Archivo:wght@400;700;900&family=Fredoka:wght@400;600;700&family=Cabin+Sketch:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%}
*,*::before,*::after{box-sizing:border-box}
body{
  --bg:#F6F7F9; --bg-img:none; --ink:#14161C; --muted:#5D6473; --surface:#FFFFFF; --surface-2:#E9ECF2;
  --border:1px solid #E6E9F0; --radius:18px; --radius-sm:10px; --card-shadow:none;
  --accent:#2F6BFF; --accent-ink:#FFFFFF; --track:#E6E9F0; --soft:#EEF3FF;
  --font-display:'Figtree', system-ui, sans-serif; --font-body:'Figtree', system-ui, sans-serif;
  --display-weight:800; --display-track:-0.04em; --body-size:17px;
  --white-key:#FFFFFF; --white-border:#DDE1E8; --black-key:#1D2230; --black-border:none;
  --key-bw:1px; --key-gap:4px; --wr:10px; --br:6px; --white-shadow:0 2px 0 #DDE1E8; --lab:#3C3428; --blab:#E5E1F0;
  --frame-bg:transparent; --frame-pad:0px; --felt:transparent; --felt-h:0px;
  --good-w:#D6F0E0; --good-b:#1E7A45; --bad-w:#FFD9D4; --bad-b:#B42318; --glow-w:#FFE9A8; --glow-b:#9A6B12; --next-w:#D6E2FF; --next-b:#2F6BFF; --dot:#2F6BFF;
  --staff-ink:#14161C; --sheet-bg:#FFFFFF; --bad-text:#B42318; --good-text:#1E7A45; --band-op:0;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) body[data-skin="clean"]{
    --bg:#16181D; --ink:#EEF0F4; --muted:#A3AAB8; --surface:#1F2229; --surface-2:#2A2E37; --soft:#262D3F;
    --border:1px solid #2E333D; --track:#2E333D; --accent:#6E97FF; --accent-ink:#0E1117;
    --staff-ink:#EEF0F4; --sheet-bg:#1F2229; --white-border:#9AA3B2; --white-shadow:0 2px 0 #9AA3B2;
    --bad-text:#FF8A7A; --good-text:#6FD49A; color-scheme:dark;
  }
}
:root[data-theme="dark"] body[data-skin="clean"]{
  --bg:#16181D; --ink:#EEF0F4; --muted:#A3AAB8; --surface:#1F2229; --surface-2:#2A2E37; --soft:#262D3F;
  --border:1px solid #2E333D; --track:#2E333D; --accent:#6E97FF; --accent-ink:#0E1117;
  --staff-ink:#EEF0F4; --sheet-bg:#1F2229; --white-border:#9AA3B2; --white-shadow:0 2px 0 #9AA3B2;
  --bad-text:#FF8A7A; --good-text:#6FD49A; color-scheme:dark;
}
body[data-skin="arcade"]{
  --bg:#1B1446; --bg-img:radial-gradient(#4A3F99 1px, transparent 1.5px); --ink:#FFFFFF; --muted:#C9C2FF;
  --surface:#251C5C; --surface-2:#352A7A; --soft:#352A7A; --border:4px solid #3FD0E0; --radius:0px; --radius-sm:0px; --card-shadow:8px 8px 0 #000;
  --accent:#FF4FA3; --accent-ink:#FFFFFF; --track:#3A3170;
  --font-display:'Press Start 2P', monospace; --font-body:'VT323', monospace; --display-weight:400; --display-track:0; --body-size:24px;
  --white-key:#F4F1FF; --white-border:#1B1446; --black-key:#1B1446; --black-border:4px solid #3FD0E0;
  --key-bw:4px; --key-gap:0px; --wr:0px; --br:0px; --white-shadow:none; --frame-bg:#000; --frame-pad:12px;
  --good-w:#A7F3C4; --good-b:#178A5A; --bad-w:#FF8FB1; --bad-b:#C2185B; --glow-w:#FFD23F; --glow-b:#B8860B; --next-w:#7FF0FF; --next-b:#0E8FA0; --dot:#FF4FA3;
  --staff-ink:#FFFFFF; --sheet-bg:#251C5C; --bad-text:#FF8FB1; --good-text:#A7F3C4; color-scheme:dark;
}
body[data-skin="primary"]{
  --bg:#EDEBE6; --ink:#111111; --muted:#3B3B3B; --surface:#FFFFFF; --surface-2:#E2DFD8; --soft:#FBE27A;
  --border:3px solid #111111; --radius:0px; --radius-sm:0px;
  --accent:#1D4ED8; --accent-ink:#FFFFFF; --track:#E2DFD8;
  --font-display:'Archivo', system-ui, sans-serif; --font-body:'Archivo', system-ui, sans-serif; --display-weight:900; --display-track:-0.05em;
  --white-key:#FFFFFF; --white-border:#111111; --black-key:#111111;
  --key-bw:3px; --key-gap:0px; --wr:0px; --br:0px; --white-shadow:none;
  --felt:repeating-linear-gradient(90deg, #E2382B 0 33.33%, #F5C400 33.33% 66.66%, #1D4ED8 66.66% 100%); --felt-h:12px;
  --good-w:#BCD0FF; --good-b:#1D4ED8; --bad-w:#F7B9B3; --bad-b:#E2382B; --glow-w:#FBE27A; --glow-b:#B38F00; --next-w:#BCD0FF; --next-b:#1D4ED8; --dot:#E2382B;
  --staff-ink:#111111; --sheet-bg:#FFFFFF; --bad-text:#C0281C; --good-text:#1D4ED8;
}
body[data-skin="candy"]{
  --bg:#F1ECFF; --ink:#2B2340; --muted:#6A5F8C; --surface:#FFFFFF; --surface-2:#E6DFFB; --soft:#E6DFFB;
  --border:none; --radius:28px; --radius-sm:16px; --card-shadow:0 6px 0 #D9D2EE;
  --accent:#6B58D3; --accent-ink:#FFFFFF; --track:#E6DFFB;
  --font-display:'Fredoka', system-ui, sans-serif; --font-body:'Fredoka', system-ui, sans-serif; --display-weight:700; --display-track:0;
  --white-key:#FFFFFF; --white-border:#D9D2EE; --black-key:#3B3355;
  --key-bw:2px; --key-gap:5px; --wr:16px; --br:10px; --white-shadow:0 4px 0 #D9D2EE; --lab:#2B2340;
  --good-w:#CFF3E3; --good-b:#178A5A; --bad-w:#FFD3D3; --bad-b:#C42B32; --glow-w:#FFF0B3; --glow-b:#9A7A00; --next-w:#DCD5FF; --next-b:#6B58D3; --dot:#E5484D;
  --staff-ink:#2B2340; --sheet-bg:#FFFFFF; --bad-text:#C42B32; --good-text:#178A5A; --band-op:1;
}
body[data-skin="chalk"]{
  --bg:#2F4A3C; --bg-img:radial-gradient(rgba(255,255,255,0.05) 1px, transparent 2px); --ink:#EDEBE1; --muted:#C9D3CB;
  --surface:rgba(0,0,0,0.12); --surface-2:rgba(255,255,255,0.08); --soft:rgba(255,255,255,0.08); --border:2px dashed rgba(237,235,225,0.45); --radius:6px; --radius-sm:4px;
  --accent:#F5E39A; --accent-ink:#22382D; --track:rgba(237,235,225,0.2);
  --font-display:'Cabin Sketch', 'Comic Sans MS', cursive; --font-body:'Atkinson Hyperlegible', system-ui, sans-serif; --display-weight:700; --display-track:0;
  --white-key:#E9E6DA; --white-border:#B9B4A3; --black-key:#1F2A24; --black-border:2px solid #6F7F75;
  --key-bw:1px; --key-gap:0px; --wr:4px; --br:3px; --white-shadow:inset 0 -6px 0 rgba(0,0,0,0.08); --frame-bg:#4E3420; --frame-pad:10px;
  --good-w:#BFE3CF; --good-b:#2F7A58; --bad-w:#F2B8B0; --bad-b:#8E2A24; --glow-w:#F5E39A; --glow-b:#8A6620; --next-w:#BDE5F2; --next-b:#2B5F7E; --dot:#C2413A;
  --staff-ink:#EDEBE1; --sheet-bg:rgba(0,0,0,0.12); --bad-text:#FFB4A8; --good-text:#BFE3CF; color-scheme:dark;
}
body{margin:0; min-height:100%; background-color:var(--bg); background-image:var(--bg-img); background-size:28px 28px; color:var(--ink); font-family:var(--font-body); font-size:var(--body-size); line-height:1.45}
body[data-skin="chalk"]{background-size:7px 7px; box-shadow:inset 0 0 0 14px #6B4A2E; min-height:100vh}
.app{max-width:1120px; margin:0 auto; padding:22px 24px 36px}
body[data-skin="chalk"] .app{padding:30px 34px 40px}
.top{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px 24px; margin-bottom:16px}
.brandrow{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap}
.brand{font-family:var(--font-display); font-weight:var(--display-weight); font-size:26px; letter-spacing:-0.02em; line-height:1}
body[data-skin="arcade"] .brand{font-size:20px; color:#FFD23F; text-shadow:4px 4px 0 #FF4FA3; letter-spacing:0}
.sub{color:var(--muted); font-weight:600; font-size:16px}
.progress{flex:1 1 200px; display:flex; align-items:center; gap:12px; min-width:160px}
.progress .bar{flex:1; height:8px; border-radius:4px; background:var(--track); overflow:hidden}
.progress .bar i{display:block; height:100%; background:var(--accent); transition:width .25s}
.progress span{font-weight:600; font-size:14px; color:var(--muted); white-space:nowrap}
.btn{font:inherit; font-weight:700; font-size:15px; min-height:44px; padding:0 18px; border-radius:var(--radius-sm); border:none; background:var(--accent); color:var(--accent-ink); cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; justify-content:center}
.btn.ghost{background:transparent; color:var(--ink); border:2px solid var(--white-border)}
.btn.big{min-height:52px; padding:0 24px; font-size:17px}
.btn:disabled{opacity:.5; cursor:not-allowed}
body[data-skin="arcade"] .btn{font-size:20px; box-shadow:4px 4px 0 #000}
body[data-skin="primary"] .btn.ghost{border:3px solid #111}
body[data-skin="chalk"] .btn.ghost{border:2px solid rgba(237,235,225,0.6)}
.iconbtn{font:inherit; font-weight:700; width:44px; height:44px; border-radius:22px; border:2px solid var(--white-border); background:transparent; color:var(--ink); cursor:pointer; font-size:20px; line-height:1; display:inline-flex; align-items:center; justify-content:center}
body[data-skin="arcade"] .iconbtn, body[data-skin="primary"] .iconbtn{border-radius:0}
button:focus-visible, select:focus-visible, a:focus-visible, input:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.card{background:var(--surface); border:var(--border); border-radius:var(--radius); box-shadow:var(--card-shadow); padding:24px 28px}
.muted{color:var(--muted)} .small{font-size:14px}
h1,h2{font-family:var(--font-display); font-weight:var(--display-weight); letter-spacing:-0.02em; margin:0; line-height:1.1}
h1{font-size:40px} h2{font-size:18px; letter-spacing:0}
body[data-skin="arcade"] h1{font-size:24px} body[data-skin="arcade"] h2{font-size:15px}
.hero{display:flex; flex-wrap:wrap; align-items:center; gap:20px 28px; margin-bottom:18px}
.hero p{margin:0; font-size:21px; line-height:1.4}
body[data-skin="arcade"] .hero p{font-size:26px}
.hero .lead{flex:1 1 320px}
.cols{display:flex; flex-wrap:wrap; gap:18px; align-items:flex-start}
.path{flex:999 1 500px; min-width:0; padding:18px 16px}
.path ol{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px}
.path li{display:flex; align-items:center; gap:16px; padding:12px 14px; border-radius:var(--radius-sm)}
.path li.next{background:var(--soft)}
.path li.locked .t{color:var(--muted)}
.path .t{display:block; font-weight:700; font-size:17px; line-height:1.3}
.path .s{display:block; font-size:14px; color:var(--muted)}
.mark{flex:none; width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:16px; border:2px solid var(--track); color:var(--muted)}
.mark.done{background:var(--good-b); border-color:var(--good-b); color:#fff}
.mark.next{border:3px solid var(--accent); color:var(--ink)}
.side{flex:1 1 260px; display:flex; flex-direction:column; gap:12px}
.side .card{padding:18px 20px; display:block; text-decoration:none; color:var(--ink); text-align:left; width:100%; font:inherit; cursor:pointer}
.side .card b{display:block; font-size:18px; margin-bottom:4px}
.side .card span{display:block; font-size:15px; color:var(--muted)}

.rulin{display:flex; flex-wrap:wrap; align-items:center; gap:14px 20px; background:var(--surface); border:var(--border); border-radius:var(--radius); box-shadow:var(--card-shadow); padding:14px 18px; margin:14px 0}
.avatar{flex:none; width:56px; height:56px; border-radius:50%; border:2px dashed #B9C2D3; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:20px; color:var(--muted); overflow:hidden}
.avatar img{width:100%; height:100%; object-fit:cover; display:block}
.avatar.lg{width:88px; height:88px; font-size:30px}
.rulin p{flex:1 1 300px; margin:0; font-size:19px; line-height:1.4}
body[data-skin="arcade"] .rulin p{font-size:25px}
.rulin .acts{display:flex; gap:8px; flex-wrap:wrap}
.stage{min-height:220px; display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:24px}
.stage.left{justify-content:flex-start}
.stage .center{text-align:center; max-width:60ch}
.stage .center p{margin:12px 0 0; font-size:19px; line-height:1.5; color:var(--muted)}
.bigprompt{display:flex; align-items:center; gap:28px; flex-wrap:wrap; justify-content:center}
.bigletter{font-family:var(--font-display); font-weight:var(--display-weight); letter-spacing:var(--display-track); font-size:120px; line-height:.9}
.bigletter.two{font-size:84px}
body[data-skin="arcade"] .bigletter{font-size:72px; width:150px; height:150px; display:flex; align-items:center; justify-content:center; background:#FF4FA3; border:6px solid #fff; box-shadow:8px 8px 0 #000}
body[data-skin="arcade"] .bigletter.two{font-size:48px}
body[data-skin="primary"] .bigletter{width:180px; height:180px; border-radius:50%; background:#1D4ED8; color:#fff; display:flex; align-items:center; justify-content:center; font-size:104px}
body[data-skin="primary"] .bigletter.two{font-size:64px}
.instr{margin:0; font-weight:600; font-size:22px; line-height:1.3}
body[data-skin="arcade"] .instr{font-family:'Press Start 2P', monospace; font-size:15px; line-height:1.6; font-weight:400; color:#FFD23F}
.dots{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap}
.dots span{width:14px; height:14px; border-radius:50%; border:2px solid var(--track)}
.dots span.on{background:var(--good-b); border-color:var(--good-b)} .dots span.cur{border-color:var(--ink)}
body[data-skin="arcade"] .dots span, body[data-skin="primary"] .dots span{border-radius:0}
.opts{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px}
.opts button{font:inherit; font-weight:700; font-size:22px; min-width:64px; height:56px; padding:0 18px; border-radius:var(--radius-sm); border:2px solid var(--white-border); background:transparent; color:var(--ink); cursor:pointer}
.opts button.good{background:var(--good-w); border-color:var(--good-b)} .opts button.bad{background:var(--bad-w); border-color:var(--bad-b)} .opts button.glow{background:var(--glow-w); border-color:var(--glow-b)}
.staffbox{width:100%}
.staffbox svg{display:block; width:100%; height:auto}
.stage .single svg{width:min(320px, 70vw)}
.tunehead{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:10px; margin-bottom:6px; width:100%}
.tunehead b{font-size:22px}
.pills{display:flex; gap:6px; flex-wrap:wrap}
.pill{display:inline-flex; align-items:center; height:30px; padding:0 12px; border-radius:15px; font-weight:600; font-size:14px; background:var(--track); color:var(--muted)}
.pill.on{background:var(--accent); color:var(--accent-ink)}
body[data-skin="arcade"] .pill, body[data-skin="primary"] .pill{border-radius:0}
.summary{display:flex; flex-wrap:wrap; gap:24px 36px; margin-top:20px}
.summary div span{display:block; font-size:14px; color:var(--muted); font-weight:600}
.summary div b{display:block; font-size:22px; margin-top:4px}
.songs{display:flex; flex-direction:column; gap:10px}
.songs .row{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; padding:14px 16px; border:var(--border); border-radius:var(--radius-sm); background:var(--surface)}
.songs .row b{font-size:18px}
.toolbar{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px}
.grp{display:flex; flex-wrap:wrap; align-items:center; gap:8px}
.seg{display:inline-flex; gap:2px; padding:4px; background:var(--surface-2); border-radius:calc(var(--radius-sm) + 2px)}
.seg button{font:inherit; font-weight:600; font-size:15px; height:40px; padding:0 14px; border:none; border-radius:var(--radius-sm); background:transparent; color:var(--muted); cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(20,22,28,0.12)}
body[data-skin="arcade"] .seg button[aria-pressed="true"]{background:#FF4FA3; color:#fff; box-shadow:none}
body[data-skin="chalk"] .seg button[aria-pressed="true"]{background:#EDEBE1; color:#22382D}
.tempo{display:flex; align-items:center; gap:8px; font-variant-numeric:tabular-nums}
.beats{display:inline-flex; gap:6px; margin-right:4px}
.beats i{width:12px; height:12px; border-radius:50%; background:var(--track)}
.beats i.on{background:var(--accent)}
.sheet{background:var(--sheet-bg); border:var(--border); border-radius:var(--radius); box-shadow:var(--card-shadow); padding:14px 16px 6px; overflow-x:auto}
.sheet svg{display:block; height:auto}
select{font:inherit; font-size:15px; color:var(--ink); background:var(--surface); border:1px solid var(--white-border); border-radius:var(--radius-sm); padding:8px 10px; min-height:40px}
.settings{display:flex; flex-direction:column; gap:18px; max-width:520px}
.settings label{display:flex; align-items:center; justify-content:space-between; gap:12px; font-weight:600}
.settings input[type=checkbox]{width:20px; height:20px; accent-color:var(--accent)}

.instrument{margin-top:4px}
.frame{background:var(--frame-bg); padding:var(--frame-pad); border-radius:calc(var(--radius-sm) / 2)}
body[data-skin="arcade"] .frame{border:4px solid #3FD0E0}
body[data-skin="clean"] .frame, body[data-skin="candy"] .frame{background:var(--surface); border:var(--border); padding:14px; border-radius:var(--radius-sm)}
.felt{height:var(--felt-h); background:var(--felt)}
body[data-skin="primary"] .felt{border:3px solid #111; border-bottom:none}
.keys{position:relative; height:clamp(170px, 24vw, 240px); user-select:none; -webkit-user-select:none; touch-action:none}
.key{position:absolute; top:0; margin:0; padding:0; font:inherit; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; -webkit-tap-highlight-color:transparent; overflow:hidden}
.key.w{height:100%; background:var(--white-key); border:var(--key-bw) solid var(--white-border); border-radius:0 0 var(--wr) var(--wr); box-shadow:var(--white-shadow); z-index:1; padding-bottom:14px; transition:background-color .12s}
.key.b{height:60%; background:var(--black-key); border:var(--black-border); border-radius:0 0 var(--br) var(--br); z-index:2; padding-bottom:8px; transition:background-color .12s}
.key.w.down{transform:translateY(1px); box-shadow:none}
.key.w.good{background:var(--good-w)} .key.b.good{background:var(--good-b)}
.key.w.bad{background:var(--bad-w)} .key.b.bad{background:var(--bad-b)}
.key.w.glow{background:var(--glow-w)} .key.b.glow{background:var(--glow-b)}
.key.w.next{background:var(--next-w)} .key.b.next{background:var(--next-b)}
.key.w.lit{background:var(--next-w)} .key.b.lit{background:var(--next-b)}
.key .lab{visibility:hidden; font-weight:700; font-size:clamp(12px, 1.5vw, 17px); line-height:1.05; color:var(--lab); pointer-events:none; text-align:center}
.key.b .lab{color:var(--blab); font-size:clamp(8px, 0.9vw, 11px)}
.keys.labels .lab, .key.labeled .lab{visibility:visible}
.key .dot{width:8px; height:8px; border-radius:50%; background:var(--dot); margin-bottom:8px; pointer-events:none}
.key .band{display:none}
body[data-skin="candy"] .key.w{padding-bottom:0}
body[data-skin="candy"] .key .band{display:block; width:100%; height:26px; margin-top:10px; opacity:var(--band-op); pointer-events:none}
.kbfoot{display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px 20px; margin-top:12px}
.kbhint{margin:0; font-size:14px; color:var(--muted); max-width:72ch}
kbd{font-family:inherit; font-weight:700; border:1px solid var(--white-border); background:var(--surface); color:var(--ink); border-radius:4px; padding:0 5px}
.mapnote{margin:8px 0 0; font-size:14px; color:var(--muted)}
[hidden]{display:none !important}
@keyframes nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.card.wrong{animation:nudge .25s ease}

function parse(n){
  const letter=n[0], acc=n[1]==='b'?'flat':n[1]==='#'?'sharp':null, oct=+n[n.length-1];
  const li=LETTERS.indexOf(letter); const d=oct*7+li; let m=(oct+1)*12+LETTER_PC[li]; if(acc==='flat') m--; if(acc==='sharp') m++;
  return {m,d,acc,name:letter+(acc==='flat'?'♭':acc==='sharp'?'♯':'')+oct, label:letter+(acc==='flat'?'♭':acc==='sharp'?'♯':'')};

// ---------- audio ----------
let ac, master;
function audio(){
  if(!ac){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; ac=new C();
    const comp=ac.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=4;
    master=ac.createGain(); master.gain.value=.55; master.connect(comp); comp.connect(ac.destination); }
  if(ac.state==='suspended') ac.resume(); return ac;
}
function playNote(m,dur,when){
  const c=audio(); if(!c) return; const f=440*Math.pow(2,(m-69)/12), t=when||c.currentTime; dur=dur||Math.max(.9,2.4-(m-48)*0.025);
  const g=c.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(.42,t+.006); g.gain.exponentialRampToValueAtTime(.14,t+.28); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.setValueAtTime(Math.min(9000,f*9),t); lp.frequency.exponentialRampToValueAtTime(Math.max(400,f*2.2),t+dur*.7); lp.connect(g); g.connect(master);
  [[1,.6,'triangle'],[2,.22,'sine'],[3,.1,'sine'],[4,.05,'sine']].forEach(([h,a,type])=>{ const o=c.createOscillator(), og=c.createGain(); o.type=type; o.frequency.value=f*h*(1+(h-1)*0.0007); og.gain.value=a; o.connect(og); og.connect(lp); o.start(t); o.stop(t+dur+.05); });
}
function click(when,accent){ const c=audio(); if(!c) return; const o=c.createOscillator(), g=c.createGain(); o.type='square'; o.frequency.value=accent?1760:1175; g.gain.setValueAtTime(0.0001,when); g.gain.exponentialRampToValueAtTime(accent?.22:.13,when+.002); g.gain.exponentialRampToValueAtTime(.0001,when+.05); o.connect(g); g.connect(master); o.start(when); o.stop(when+.06); }

// ---------- notation ----------
const BOT={treble:30,bass:18};
const colors=()=>{ const cs=getComputedStyle(document.body); return {ink:cs.getPropertyValue('--staff-ink').trim()||'#14161C', accent:cs.getPropertyValue('--accent').trim()||'#2F6BFF', good:cs.getPropertyValue('--good-b').trim()||'#1E7A45'}; };
const glyph=(name,x,y,c)=>`<path d="${G[name]}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(0.04 -0.04)" fill="${c}"/>`;
function staffLines(by,x0,x1,c){ let s=''; for(let i=0;i<5;i++){ const y=by-i*10; s+=`<line x1="${x0}" x2="${x1}" y1="${y}" y2="${y}" stroke="${c}" stroke-width="1.3"/>`; } return s; }
const yOf=(d,clef,by)=>by-(d-BOT[clef])*5;
function noteSVG(o){
  const {d,clef,by,x,c}=o, b=BOT[clef], y=yOf(d,clef,by); let s='';
  for(let k=b-2;k>=d;k-=2){ const ly=yOf(k,clef,by); s+=`<line x1="${x-12}" x2="${x+12}" y1="${ly}" y2="${ly}" stroke="${c}" stroke-width="1.3"/>`; }
  for(let k=b+10;k<=d;k+=2){ const ly=yOf(k,clef,by); s+=`<line x1="${x-12}" x2="${x+12}" y1="${ly}" y2="${ly}" stroke="${c}" stroke-width="1.3"/>`; }
  if(o.acc) s+=glyph(o.acc,x-25,y,c);
  const kind=o.kind||'head', hollow=kind==='h'||kind==='dh'||kind==='w';
  s+= hollow ? `<ellipse cx="${x}" cy="${y}" rx="${kind==='w'?7.6:6.6}" ry="4.6" fill="none" stroke="${c}" stroke-width="${kind==='w'?2.6:2}" transform="rotate(${kind==='w'?-10:-20} ${x} ${y})"/>` : `<ellipse cx="${x}" cy="${y}" rx="7" ry="5" fill="${c}" transform="rotate(-20 ${x} ${y})"/>`;
  if(kind!=='head'&&kind!=='w'){ const up=o.stemDir?o.stemDir==='up':d<b+4; const sx=up?x+6.4:x-6.4, y2=up?y-34:y+34;
    s+=`<line x1="${sx}" x2="${sx}" y1="${y}" y2="${y2}" stroke="${c}" stroke-width="1.6"/>`;
    if(kind==='e') s+= up?`<path d="M${sx} ${y2} q 1 10 9 14 q 4 5 1 13" fill="none" stroke="${c}" stroke-width="2"/>`:`<path d="M${sx} ${y2} q 1 -10 9 -14 q 4 -5 1 -13" fill="none" stroke="${c}" stroke-width="2"/>`; }
  if(kind==='dq'||kind==='dh'){ const dy=(d-b)%2===0?y-5:y; s+=`<circle cx="${x+13}" cy="${dy}" r="2.2" fill="${c}"/>`; }
  return s;
}
function systemSVG(width,c,grand,single,x0){
  x0=x0||8; let s='';
  if(grand){ s+=staffLines(100,20,width-10,c)+staffLines(190,20,width-10,c)+`<line x1="20" x2="20" y1="60" y2="190" stroke="${c}" stroke-width="1.6"/><path d="M13 60 q -6 2 -6 14 v 38 q 0 10 -4 13 q 4 3 4 13 v 38 q 0 12 6 14" fill="none" stroke="${c}" stroke-width="2.4"/>`+glyph('gclef',26,100,c)+glyph('fclef',26,190,c); }
  else { s+=staffLines(100,x0,width-8,c)+`<line x1="${x0}" x2="${x0}" y1="60" y2="100" stroke="${c}" stroke-width="1.6"/>`+glyph(single==='treble'?'gclef':'fclef',x0+6,100,c); }

function spell(m,prev){ const pc=m%12, oct=octOf(m); if(!isBlack(pc)) return {d:oct*7+PC_LETTER[pc],acc:null}; if(prev!=null&&m<prev){ const n=m+1; return {d:octOf(n)*7+PC_LETTER[n%12],acc:'flat'}; } const n=m-1; return {d:octOf(n)*7+PC_LETTER[n%12],acc:'sharp'}; }

const TUNES={

  odeBoth:{title:'Ode to Joy, two hands', beats:4, range:[48,72], ev:[T(2,'E4','C3'),T(2,'E4'),T(2,'F4'),T(2,'G4'),T(2,'G4','G3'),T(2,'F4'),T(2,'E4'),T(2,'D4'),T(2,'C4','C3'),T(2,'C4'),T(2,'D4'),T(2,'E4'),T(3,'E4','G3'),T(1,'D4'),T(4,'D4','C3')]}
};
Object.values(TUNES).forEach(t=>{ let pos=t.pickup?(t.beats*2-t.pickup):0; t.ev.forEach(e=>{ e.pos=pos; pos+=e.len; e.notes=[...e.rh.map(n=>({...parse(n),hand:'rh'})),...e.lh.map(n=>({...parse(n),hand:'lh'}))]; }); t.total=pos; t.twoHands=t.ev.some(e=>e.lh.length)&&t.ev.some(e=>e.rh.length); t.lhOnly=!t.ev.some(e=>e.rh.length); });
function tuneSVG(tune, played, nextIdx, opts){
  // opts: {names, width}
  const cs=colors(), c=cs.ink, barE=tune.beats*2, bars=Math.ceil(tune.total/barE);
  const perRow = opts.width<560 ? 2 : 4, rows=Math.ceil(bars/perRow);
  const grand = tune.twoHands, lhOnly=tune.lhOnly;
  const rowH = grand?250:170, W=Math.max(420,opts.width);
  const left=grand?48:44, barW=(W-left-16)/perRow;
  let s=`<svg viewBox="0 0 ${W} ${rows*rowH}" role="img" aria-label="${esc(tune.title)} notation">`;
  for(let r=0;r<rows;r++){
    const oy=r*rowH;
    let sys='';
    if(grand){ sys=`<g transform="translate(0 ${oy})">${systemSVG(W,c,true)}</g>`; }
    else { sys=`<g transform="translate(0 ${oy})">${systemSVG(W,c,false,lhOnly?'bass':'treble',8)}</g>`; }
    s+=sys;
    if(r===0){ const ys=grand?[100,190]:[100]; ys.forEach(y=>{ s+=`<text x="${left-4}" y="${y-20+oy}" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="24" fill="${c}">${tune.beats}</text><text x="${left-4}" y="${y+oy}" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="24" fill="${c}">4</text>`; }); }
    for(let b=1;b<=perRow;b++){ const bi=r*perRow+b; if(bi>bars) break; const bx=left+8+b*barW; const yTop=60+oy, yBot=(grand?190:100)+oy;
      s+= bi===bars ? `<line x1="${bx-5}" x2="${bx-5}" y1="${yTop}" y2="${yBot}" stroke="${c}" stroke-width="1.3"/><line x1="${bx-1}" x2="${bx-1}" y1="${yTop}" y2="${yBot}" stroke="${c}" stroke-width="3.5"/>` : `<line x1="${bx}" x2="${bx}" y1="${yTop}" y2="${yBot}" stroke="${c}" stroke-width="1.3"/>`; }
  }
  tune.ev.forEach((e,i)=>{
    const bar=Math.floor(e.pos/barE), r=Math.floor(bar/perRow), bInRow=bar%perRow, oy=r*rowH;
    const x=left+8+bInRow*barW+18+(e.pos%barE)*((barW-30)/barE);
    const col = i<played ? cs.good : i===nextIdx ? cs.accent : c;
    e.notes.forEach(n=>{ const clef = n.hand==='lh'||lhOnly ? 'bass':'treble'; const by=(grand?(clef==='treble'?100:190):100)+oy; s+=noteSVG({d:n.d,clef,by,x,c:col,acc:n.acc,kind:KIND[e.len]}); });
    if(opts.names){ const yy=(grand?190:100)+oy+30; s+=`<text x="${x}" y="${yy}" text-anchor="middle" font-family="${opts.font}" font-weight="700" font-size="14" fill="${col}">${esc(e.notes.map(n=>n.label).join(' '))}</text>`; }
    if(i===nextIdx){ const yTop=42+oy, h=(grand?190:100)+oy+36-yTop; s+=`<rect x="${x-15}" y="${yTop}" width="30" height="${h}" rx="7" fill="none" stroke="${cs.accent}" stroke-width="2"/>`; }
  });
  return s+'</svg>';
}

// ---------- keyboard ----------
let keyEls={}, builtRange='';
const keysEl=$('keys');
function setRange(r){ S.range=r; buildKeys(); }
function buildKeys(){
  let [lo,hi]=S.range; if(window.innerWidth<700 && hi-lo>24){ lo=Math.max(lo, hi-24); }
  builtRange=lo+'-'+hi; keysEl.innerHTML=''; keyEls={};
  const whites=[]; for(let m=lo;m<=hi;m++) if(!isBlack(m%12)) whites.push(m); const n=whites.length;
  const mk=(m,cls)=>{ const b=document.createElement('button'); b.type='button'; b.className='key '+cls; b.dataset.midi=m; b.tabIndex=-1; b.setAttribute('aria-label', fullName(m)+(m===60?', middle C':'')); const pc=m%12;
    b.innerHTML=(m===60?'<span class="dot"></span>':'')+`<span class="lab">${isBlack(pc)?`${SHARP[pc]}<br>${FLAT[pc]}`:SHARP[pc]}</span>`+(cls==='w'?`<span class="band" style="background:${NOTE_COLOR[pc]}"></span>`:''); keyEls[m]=b; return b; };
  whites.forEach((m,i)=>{ const b=mk(m,'w'); b.style.left=`calc(${i} * 100% / ${n} + var(--key-gap) / 2)`; b.style.width=`calc(100% / ${n} - var(--key-gap))`; keysEl.appendChild(b); });
  for(let m=lo;m<=hi;m++) if(isBlack(m%12)){ const i=whites.indexOf(m-1); const b=mk(m,'b'); b.style.left=`calc(${i+1} * 100% / ${n} - 100% / ${n} * 0.31)`; b.style.width=`calc(100% / ${n} * 0.62)`; keysEl.appendChild(b); }
  if(keyEls[lo]) keyEls[lo].tabIndex=0;
  S.octaveShift=0; keysEl.classList.toggle('labels', S.names && S.view!=='lesson' && S.view!=='practice');
  $('mapnote').textContent=`Keys shown: ${fullName(lo)} to ${fullName(hi)}. The dot marks middle C.`;
}
function mark(m,cls,ms){ const el=keyEls[m]; if(!el) return; el.classList.add(cls); if(ms) setTimeout(()=>el.classList.remove(cls),ms); }
function unmarkAll(cls){ Object.values(keyEls).forEach(el=>el.classList.remove(cls)); }
function label(ms,on){ ms.forEach(m=>{ const el=keyEls[m]; if(el) el.classList.toggle('labeled', on); }); }
function down(m,on){ const el=keyEls[m]; if(el) el.classList.toggle('down',on); }
const activePointers={};
keysEl.addEventListener('pointerdown',e=>{ const k=e.target.closest('.key'); if(!k) return; e.preventDefault(); const m=+k.dataset.midi; activePointers[e.pointerId]=m; press(m); });
const endPointer=e=>{ const m=activePointers[e.pointerId]; if(m!=null){ delete activePointers[e.pointerId]; release(m); } };
window.addEventListener('pointerup',endPointer); window.addEventListener('pointercancel',endPointer);
keysEl.addEventListener('keydown',e=>{ const k=e.target.closest('.key'); if(!k) return; if(e.key==='Enter'||e.key===' '){ e.preventDefault(); if(!e.repeat) press(+k.dataset.midi); } });
keysEl.addEventListener('keyup',e=>{ const k=e.target.closest('.key'); if(!k) return; if(e.key==='Enter'||e.key===' ') release(+k.dataset.midi); });
const KEYMAP={a:0,w:1,s:2,e:3,d:4,f:5,t:6,g:7,y:8,h:9,u:10,j:11,k:12,o:13,l:14,p:15,';':16,"'":17}; const heldKeys={};
document.addEventListener('keydown',e=>{ if(e.metaKey||e.ctrlKey||e.altKey) return; if(e.target.matches&&e.target.matches('select, input, textarea, button')) return;
  const key=e.key.toLowerCase(); const [lo,hi]=builtRange.split('-').map(Number);
  if(key==='z'||key==='x'){ if(e.repeat) return; const max=Math.floor((hi-lo)/12); S.octaveShift=Math.max(0,Math.min(max,S.octaveShift+(key==='x'?1:-1))); return; }
  if(key in KEYMAP){ e.preventDefault(); if(e.repeat) return; const m=lo+12*S.octaveShift+KEYMAP[key]; if(m>=lo&&m<=hi){ heldKeys[key]=m; press(m); } } });
document.addEventListener('keyup',e=>{ const key=e.key.toLowerCase(); if(heldKeys[key]!=null){ release(heldKeys[key]); delete heldKeys[key]; } });

function press(m){ playNote(m); down(m,true); if(S.view==='lesson'||S.view==='practice'||S.view==='song') stepPress(m); else if(S.view==='studio') writePress(m); }
function release(m){ down(m,false); if(S.view==='studio') writeRelease(m); if(S.play) S.play.held.delete(m); }

function say(line, expr, acts){ const p=$('rulinLine'); if(p) p.innerHTML=line; const a=$('rulinActs'); if(a&&acts!=null) a.innerHTML=acts; if(expr){ const av=document.querySelector('#rulin .avatar'); if(av) av.outerHTML=avatarHTML(expr); } }

function setSkin(s){ S.skin=s; document.body.dataset.skin=s; store.set('skin',s); document.body.style.setProperty('--band-op', s==='candy'?1:0); if(S.view==='lesson'||S.view==='practice'||S.view==='song') renderStep(); if(S.view==='studio') renderSheet(); }

// ---------- lesson engine ----------
function startLesson(n){
  audio(); S.view='lesson'; S.lesson=n; S.stepIdx=0; S.token++;
  const L=LESSONS[n-1]; setRange(L.range); keysEl.classList.remove('labels');
  runStep();
}
function exitBtn(){ return `<button class="btn ghost" id="exitBtn" type="button">Exit lesson</button>`; }
function runStep(){
  const L=LESSONS[S.lesson-1]; S.step=L.steps[S.stepIdx]; S.token++; S.drill=null; S.play=null; S.locked=false;
  unmarkAll('glow'); unmarkAll('next'); unmarkAll('labeled');
  setTop(`Lesson ${S.lesson}: ${L.name}`, [S.stepIdx+1, L.steps.length], exitBtn()); $('exitBtn').onclick=home;
  renderStep();
}
function nextStep(){ const L=LESSONS[S.lesson-1]; if(S.stepIdx<L.steps.length-1){ S.stepIdx++; runStep(); } else home(); }
function renderStep(){
  const st=S.step; if(!st) return;
  if(st.t==='show') renderShow(st);
  else if(st.t==='drill') renderDrill();
  else if(st.t==='play') renderPlay();
  else if(st.t==='done') renderDone(st);
}
function staffSingle(clef,d,acc){ const c=colors().ink; return `<svg viewBox="0 0 260 150" role="img" aria-label="A note on the ${clef} staff">${systemSVG(260,c,false,clef)}${noteSVG({d,clef,by:100,x:170,c,acc,kind:'q'})}</svg>`; }
function renderShow(st){
  let visual='';
  if(st.staff) visual=`<div class="single" id="showStaff">${staffSingle(st.staff.clef,st.staff.d,st.staff.acc)}</div>`;
  if(st.grandDemo){ const t=TUNES.odeBoth; visual=`<div class="staffbox">${tuneSVG(t,0,-1,{names:false,width:Math.min(900,view.clientWidth-60),font:'Figtree, sans-serif'})}</div>`; }
  if(st.demoTune){ const t=TUNES[st.demoTune]; visual=`<div class="staffbox">${tuneSVG(t,0,-1,{names:true,width:Math.min(900,view.clientWidth-60),font:'Figtree, sans-serif'})}</div>`; }
  view.innerHTML=`<div class="card stage ${visual?'':''}"><div class="center"><h1>${st.title}</h1><p>${st.text}</p></div>${visual}</div>${rulinRow(st.line, `${(st.demo||st.demoRead||st.demoTune||st.demoClick)?'<button class="btn ghost" id="showMe" type="button">Show me</button>':''}<button class="btn" id="nextBtn" type="button">Got it, next</button>`, st.expr||'neutral')}`;
  (st.glow||[]).forEach(m=>mark(m,'glow')); label(st.labels||[], true);
  const demo=async()=>{
    const tok=S.token; const c=audio(); if(!c) return;
    if(st.demoClick){ const t=c.currentTime+.1; for(let i=0;i<8;i++) click(t+i*.6, i%4===0); }
    if(st.demoTune){ const t=TUNES[st.demoTune], e8=.3, t0=c.currentTime+.15; if(st.click!==false) for(let b=0;b<8;b++) click(t0+b*e8*2, b%4===0);

function writePress(m){
  if(W.mode==='notes'){ const list=W.notes, t=performance.now(), last=list[list.length-1]; const prevTop=last?Math.max(...last.ms):null;
    if(last&&t-last.t<60&&!last.ms.includes(m)){ last.ms.push(m); last.sp.push(spell(m,null)); } else list.push({t,ms:[m],sp:[spell(m,prevTop)]}); renderSheet(); return; }
  if(!W.metro){ say('Start the metronome, then play along. You\u2019ll hear four clicks first.','neutral'); return; }
  const list=W.rhythm, t=nowMs(), last=list[list.length-1]; let e=Math.max(0,Math.round((t-W.t0)/eighthMs()));
  if(last&&t-last.t<60&&!last.ms.includes(m)){ last.ms.push(m); last.sp.push(spell(m,null)); W.held[m]=last; renderSheet(); return; }
  if(last&&e<=last.e) e=last.e+1; const prevTop=last?Math.max(...last.ms):null;
  const entry={t,e,ms:[m],sp:[spell(m,prevTop)],endE:null}; list.push(entry); W.held[m]=entry; renderSheet();
}
function writeRelease(m){ if(W.mode!=='rhythm') return; const en=W.held[m]; if(!en) return; delete W.held[m]; if(Object.values(W.held).includes(en)) return; en.endE=Math.max(en.e+1,Math.round((nowMs()-W.t0)/eighthMs())); renderSheet(); }
const NOTE_LENS=[8,6,4,3,2,1], REST_LENS=[8,4,2,1], REST_GLYPH={8:'rw',4:'rh',2:'rq',1:'re'};
function splitLen(pos,len,allowed){ const out=[]; while(len>0){ const room=8-(pos%8); let chunk=Math.min(len,room); while(chunk>0){ const L=allowed.find(a=>a<=chunk&&!(a===8&&pos%8!==0)); out.push({pos,len:L}); pos+=L; len-=L; chunk-=L; } } return out; }
function layout(entries,nowE){ const items=[]; let cursor=0; entries.forEach((en,i)=>{ if(en.e>cursor) splitLen(cursor,en.e-cursor,REST_LENS).forEach(p=>items.push({type:'rest',...p})); const next=entries[i+1]?entries[i+1].e:null; let end=en.endE!=null?en.endE:(next!=null?next:Math.max(en.e+1,nowE)); if(next!=null) end=Math.min(end,next); end=Math.max(end,en.e+1); const parts=splitLen(en.e,end-en.e,NOTE_LENS); parts.forEach((p,j)=>items.push({type:'note',...p,entry:en,tie:j<parts.length-1})); cursor=end; }); const total=Math.max(8,Math.ceil(cursor/8)*8); if(cursor<total) splitLen(cursor,total-cursor,REST_LENS).forEach(p=>items.push({type:'rest',...p})); return {items,bars:total/8}; }
function renderSheet(){
  const wrap=$('sheetWrap'); if(!wrap) return; const cs=colors(), c=cs.ink; const avail=Math.max(320,wrap.clientWidth-34); let svg='', width=avail;
  if(W.mode==='notes'){ const list=W.notes, step=44; width=Math.max(avail,110+list.length*step+30); let body=''; list.forEach((en,i)=>{ const x=110+i*step, col=i===list.length-1?cs.accent:c; en.ms.forEach((m,j)=>{ const sp=en.sp[j], clef=m>=60?'treble':'bass'; body+=noteSVG({d:sp.d,clef,by:clef==='treble'?100:190,x,c:col,acc:sp.acc,kind:'head'}); }); }); svg=systemSVG(width,c,true)+body; }
  else { const nowE=W.metro?Math.max(0,Math.round((nowMs()-W.t0)/eighthMs())):0; const {items,bars}=layout(W.rhythm,nowE); const barW=8*30+30, x0=110; width=Math.max(avail,x0+bars*barW+20); let body='';
    [80,170].forEach(y=>{ body+=`<text x="78" y="${y}" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="26" fill="${c}">4</text><text x="78" y="${y+20}" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="26" fill="${c}">4</text>`; });
    for(let b=1;b<=bars;b++){ const bx=x0+b*barW; body+= b<bars?`<line x1="${bx}" x2="${bx}" y1="60" y2="190" stroke="${c}" stroke-width="1.3"/>`:`<line x1="${bx-6}" x2="${bx-6}" y1="60" y2="190" stroke="${c}" stroke-width="1.3"/><line x1="${bx-1}" x2="${bx-1}" y1="60" y2="190" stroke="${c}" stroke-width="4"/>`; }
    const xOf=pos=>x0+Math.floor(pos/8)*barW+22+(pos%8)*30; const lastEntry=W.rhythm[W.rhythm.length-1];
    items.forEach(it=>{ const x=xOf(it.pos); if(it.type==='rest'){ const shift=(it.len===8||it.len===4)?10:0; body+=glyph(REST_GLYPH[it.len],x-6,100-shift,c); return; } const col=it.entry===lastEntry?cs.accent:c;
      it.entry.ms.forEach((m,j)=>{ const sp=it.entry.sp[j], clef=m>=60?'treble':'bass', by=clef==='treble'?100:190; body+=noteSVG({d:sp.d,clef,by,x,c:col,acc:it.pos===it.entry.e?sp.acc:null,kind:KIND[it.len]}); if(it.tie){ const nx=xOf(it.pos+it.len), y=yOf(sp.d,clef,by)+8; body+=`<path d="M${x+5} ${y} Q ${(x+nx)/2} ${y+11} ${nx-5} ${y}" fill="none" stroke="${col}" stroke-width="1.6"/>`; } }); });
    svg=systemSVG(x0+bars*barW+10,c,true)+body; }
  $('sheet').innerHTML=`<svg id="sheetSvg" xmlns="http://www.w3.org/2000/svg" width="${width}" height="230" viewBox="0 0 ${width} 230" role="img" aria-label="Sheet music of what you played">${svg}</svg>`; wrap.scrollLeft=wrap.scrollWidth;
}
let metroTimer=null, nextBeat=0;
function startMetro(){ const c=audio(); if(!c) return; W.rhythm=[]; const beat=60/W.tempo; W.t0=(c.currentTime+.15+4*beat)*1000; W.metro=true; nextBeat=-4; $('metroBtn').textContent='Stop metronome'; $('tDown').disabled=$('tUp').disabled=true; say('Four clicks, then play. Notes snap to the nearest eighth note.','demo');
  clearInterval(metroTimer); metroTimer=setInterval(()=>{ const now=c.currentTime, b=60/W.tempo; while(W.t0/1000+nextBeat*b<now+.12){ const when=W.t0/1000+nextBeat*b; if(when>=now-.01) click(when,((nextBeat%4)+4)%4===0); nextBeat++; } const cur=Math.floor((now-W.t0/1000)/b); document.querySelectorAll('#beats i').forEach((el,i)=>el.classList.toggle('on',((cur%4)+4)%4===i)); },25); renderSheet(); }
function stopMetro(){ if(!W.metro) return; clearInterval(metroTimer); W.metro=false; Object.keys(W.held).forEach(m=>writeRelease(+m)); const b=$('metroBtn'); if(b){ b.textContent='Start metronome'; $('tDown').disabled=$('tUp').disabled=false; } document.querySelectorAll('#beats i').forEach(el=>el.classList.remove('on')); if(S.view==='studio') renderSheet(); }
let downloads=null;
if(window.claude&&typeof window.claude.use==='function'){ window.claude.use('downloads').then(d=>{ downloads=d; const b=$('wSave'); if(b) b.hidden=!d; }).catch(()=>{}); }
async function saveImage(){ if(!downloads) return; const svgEl=$('sheetSvg'); if(!svgEl) return; const w=+svgEl.getAttribute('width'), h=230, scale=2; const bg=getComputedStyle($('sheetWrap')).backgroundColor; const xml=new XMLSerializer().serializeToString(svgEl); const img=new Image();
  img.onload=()=>{ const cv=document.createElement('canvas'); cv.width=(w+40)*scale; cv.height=(h+20)*scale; const ctx=cv.getContext('2d'); ctx.fillStyle=(bg&&bg!=='rgba(0, 0, 0, 0)')?bg:'#ffffff'; ctx.fillRect(0,0,cv.width,cv.height); ctx.scale(scale,scale); ctx.drawImage(img,20,10,w,h); cv.toBlob(async blob=>{ try{ await downloads.save({filename:'middle-c-sheet.png',data:blob}); say('Saved.','happy'); }catch(err){ if(err&&err.code!=='declined') say('The image could not be saved here.','neutral'); } },'image/png'); };
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml); }

let rz; window.addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>{ buildKeys(); if(S.view==='studio') renderSheet(); if(S.play) cueNext(); },150); });
window.__mc={S,P,LESSONS,TUNES,press,release,startLesson,home,nextStep,startPractice,songbook,playSong,studio,setSkin,layout,targetMidi};
document.body.dataset.skin=S.skin; document.body.style.setProperty('--band-op', S.skin==='candy'?1:0);
home();
})();
